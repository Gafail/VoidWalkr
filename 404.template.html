<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoidWalkr — Page not found</title>
  <meta http-equiv="refresh" content="5;url={{VW_BASE}}index.html" />
  <meta name="theme-color" content="#0a0a0c" />
  <!--
    This page carries its CSS inline and redirects with an absolute path.

    GitHub's own built-in 404 page is served under
      Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; ...
    which blocks external stylesheets and scripts. Inlining the CSS means this
    page renders correctly whichever 404 GitHub serves, and the absolute
    redirect means it lands on the site root no matter how deep the missing
    URL was. build.sh generates this file from 404.template.html.
  -->
  <style id="vw-404-styles">
{{VW_STYLES}}
  </style>
</head>
<body class="theme-dark is-invalid">
  <main class="vw-invalid-card" role="main">
    <h1 class="vw-invalid-title">Page not found</h1>
    <p class="vw-invalid-sub">Redirecting you home in a few seconds…</p>
    <p style="margin-top:16px;"><a href="{{VW_BASE}}index.html" style="color:var(--vw-accent-2);">Go now</a></p>
  </main>
</body>
</html>
