<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoidWalkr — Page not found</title>
  <meta http-equiv="refresh" content="5;url=/index.html" />
  <meta name="theme-color" content="#0a0a0c" />
  <!--
    GitHub Pages serves 404 responses with
      Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'
    which blocks external stylesheets, scripts and images. The stylesheet is
    therefore inlined here by build.sh, and the redirect uses an absolute
    path so it resolves regardless of how deep the missing URL was.
  -->
  <style id="vw-404-styles">
    /* Inlined from css/style.css, css/themes.css and css/invalid.css by build.sh.
       GitHub Pages blocks external stylesheets on 404 responses. */
    /* ---- css/style.css ---- */
:root {
  --vw-fg: #f4f4f5;
  --vw-fg-dim: #a1a1aa;
  --vw-accent: #8b5cf6;
  --vw-accent-2: #06b6d4;
  --vw-danger: #f87171;
  --vw-border: rgba(255, 255, 255, 0.08);
  --vw-card: rgba(255, 255, 255, 0.04);
  --vw-radius: 14px;
  --vw-radius-sm: 8px;
  --vw-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
  --vw-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: var(--vw-font);
  color: var(--vw-fg);
  background: #0a0a0c;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 32px 16px 64px;
  overflow-x: hidden;
}

body.is-home {
  justify-content: safe center;
  padding-top: 16px;
  padding-bottom: 16px;
  min-height: 100vh;
}

a { color: var(--vw-fg); }

button {
  font: inherit;
  cursor: pointer;
  border: 1px solid var(--vw-border);
  background: var(--vw-card);
  color: var(--vw-fg);
  padding: 12px 20px;
  border-radius: var(--vw-radius-sm);
  transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
}

button:hover { background: rgba(255, 255, 255, 0.08); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 2px solid var(--vw-accent); outline-offset: 2px; }

input[type="text"] {
  font: inherit;
  width: 100%;
  background: var(--vw-card);
  border: 1px solid var(--vw-border);
  color: var(--vw-fg);
  padding: 14px 16px;
  border-radius: var(--vw-radius-sm);
}

input[type="text"]:focus {
  outline: none;
  border-color: var(--vw-accent);
}

input[type="text"].shake {
  animation: vw-shake 360ms cubic-bezier(.36,.07,.19,.97) both;
  border-color: var(--vw-danger);
}

@keyframes vw-shake {
  10%, 90% { transform: translateX(-1px); }
  20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-4px); }
  40%, 60% { transform: translateX(4px); }
}

.vw-logo {
  display: flex;
  align-items: center;
  gap: 24px;
  font-weight: 600;
  font-size: 56px;
  letter-spacing: 0.02em;
  text-decoration: none;
  margin-bottom: 40px;
}

.vw-logo-mark {
  width: 96px;
  height: 96px;
  border-radius: 16px;
  display: inline-block;
  object-fit: cover;
}

.vw-card {
  width: 100%;
  max-width: 760px;
  background: var(--vw-card);
  border: 1px solid var(--vw-border);
  border-radius: var(--vw-radius);
  padding: 24px;
  backdrop-filter: blur(6px);
}

.vw-stack { display: flex; flex-direction: column; gap: 16px; }
.vw-row { display: flex; gap: 12px; flex-wrap: wrap; }
.vw-row > * { flex: 1 1 0; min-width: 180px; }
.vw-row-center { justify-content: center; }
.vw-row-center > * { flex: 0 0 auto; min-width: 0; }
.vw-row-stack-center { flex-direction: column; align-items: center; gap: 6px; }

.vw-blurb {
  margin: 0;
  font-size: 15px;
  line-height: 1.5;
  color: var(--vw-fg-dim);
  text-align: center;
}

.vw-section-title {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  text-align: center;
  width: 100%;
  color: var(--vw-fg);
}

.vw-section-title--dim {
  color: var(--vw-fg-dim);
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 6px;
}

.vw-input-wrap { position: relative; }
.vw-input-error {
  color: var(--vw-danger);
  font-size: 13px;
  min-height: 18px;
  opacity: 0;
  transition: opacity 120ms ease;
}
.vw-input-error.is-visible { opacity: 1; }

.vw-btn-primary {
  background: linear-gradient(135deg, var(--vw-accent), var(--vw-accent-2));
  border: none;
  color: #fff;
  font-weight: 600;
}
.vw-btn-primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, var(--vw-accent), var(--vw-accent-2)); }

.vw-theme-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.vw-theme-card {
  position: relative;
  display: block;
  border: 1px solid var(--vw-border);
  border-radius: var(--vw-radius-sm);
  padding: 12px 14px;
  cursor: pointer;
  background: var(--vw-card);
  user-select: none;
}
.vw-theme-card input { position: absolute; opacity: 0; pointer-events: none; }
.vw-theme-card .vw-swatch {
  width: 100%;
  height: 36px;
  border-radius: 6px;
  margin-bottom: 8px;
  border: 1px solid var(--vw-border);
}
.vw-theme-card .vw-theme-name { font-size: 14px; font-weight: 500; }
.vw-theme-card:has(input:checked) { border-color: var(--vw-accent); }

.vw-footer {
  margin-top: 32px;
  font-size: 12px;
  color: var(--vw-fg-dim);
}

@media (max-width: 640px) {
  .vw-theme-grid { grid-template-columns: 1fr; }
  .vw-row { flex-direction: column; }
  .vw-video-wrap { border-radius: 0; }
}

.vw-viewer {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  position: relative;
}

.vw-back-home {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  font-size: 13px;
  color: rgba(255, 255, 255, 0.35);
  text-decoration: none;
  letter-spacing: 0.02em;
  padding: 6px 10px;
  border-radius: 6px;
  transition: color 120ms ease, background 120ms ease;
  z-index: 5;
  user-select: none;
}
.vw-back-home:hover,
.vw-back-home:focus-visible {
  color: rgba(255, 255, 255, 0.75);
  background: rgba(255, 255, 255, 0.05);
  outline: none;
}

body.is-viewer {
  padding: 0;
  justify-content: center;
}

html.vw-route-viewer body > *:not(.vw-viewer) { display: none !important; }

.vw-video-wrap {
  width: min(80vw, calc(90vh * 16 / 9));
  height: min(calc(80vw * 9 / 16), 90vh);
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}

#youtube-player,
#youtube-player iframe {
  width: 100%;
  height: 100%;
  display: block;
  border: 0;
}

.vw-copy-status {
  display: inline-flex;
  align-items: center;
  font-size: 13px;
  color: var(--vw-fg-dim);
  min-height: 20px;
}
.vw-copy-status.is-success { color: #34d399; }
.vw-copy-status.is-error   { color: var(--vw-danger); }

/* Constrain the Copy VoidWalkr Link button + status to match the Ko-fi width. */
.vw-row-center #copy-link-btn {
  flex: 0 0 auto;
  min-width: 220px;
  max-width: 320px;
  width: 100%;
}

.vw-license-note {
  margin: -8px 0 0;
  text-align: center;
  font-size: 12px;
  color: var(--vw-fg-dim);
  opacity: 0.75;
}

.vw-kofi-wrap {
  display: flex;
  justify-content: center;
  margin: 12px 0 0;
}
.vw-kofi-wrap .btn-container {
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
  text-align: center;
}
.vw-kofi-wrap a.kofi-button {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif !important;
  display: block !important;
  width: 100% !important;
  max-width: 320px;
  margin: 0 auto;
  min-width: 0 !important;
}

/* Fullscreen player (short links with fs=1): drop the rounded corners so the
   video reaches the screen edge. */
.vw-video-wrap:fullscreen,
.vw-video-wrap:-webkit-full-screen {
  border-radius: 0;
  width: 100%;
  height: 100%;
}
    /* ---- css/themes.css ---- */
body.theme-dark {
  background: #0a0a0c;
  background-image:
    radial-gradient(circle at 20% 0%, rgba(139, 92, 246, 0.05), transparent 40%),
    radial-gradient(circle at 80% 100%, rgba(6, 182, 212, 0.04), transparent 40%);
}

body.theme-neon {
  background:
    radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.35), transparent 50%),
    radial-gradient(circle at 70% 80%, rgba(6, 182, 212, 0.35), transparent 50%),
    #0a0a0c;
}

body.theme-blur {
  background: #111418;
  background-image:
    radial-gradient(circle at 25% 10%, rgba(148, 163, 184, 0.08), transparent 45%),
    radial-gradient(circle at 75% 90%, rgba(100, 116, 139, 0.06), transparent 45%);
}

body.theme-midnight {
  background: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
}

.vw-theme-card .vw-swatch.theme-dark-sw     { background: #0a0a0c; }
.vw-theme-card .vw-swatch.theme-neon-sw     { background: linear-gradient(135deg, #8b5cf6, #06b6d4); }
.vw-theme-card .vw-swatch.theme-blur-sw     { background: #111418; }
.vw-theme-card .vw-swatch.theme-midnight-sw { background: linear-gradient(180deg, #0f0c29, #302b63 50%, #24243e); }
    /* ---- css/invalid.css ---- */
body.is-invalid {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.vw-invalid-card {
  max-width: 460px;
  width: 100%;
  text-align: center;
  background: var(--vw-card);
  border: 1px solid var(--vw-border);
  border-radius: var(--vw-radius);
  padding: 36px 28px;
  backdrop-filter: blur(6px);
}

.vw-invalid-title {
  font-size: 22px;
  font-weight: 600;
  margin: 0 0 8px;
}

.vw-invalid-sub {
  color: var(--vw-fg-dim);
  font-size: 15px;
  margin: 0 0 24px;
}

.vw-countdown {
  font-family: var(--vw-mono);
  font-size: 64px;
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1;
  margin-bottom: 24px;
  background: linear-gradient(135deg, var(--vw-accent), var(--vw-accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.vw-go-home {
  font-size: 15px;
  padding: 12px 24px;
}
  </style>
</head>
<body class="theme-dark is-invalid">
  <main class="vw-invalid-card" role="main">
    <h1 class="vw-invalid-title">Page not found</h1>
    <p class="vw-invalid-sub">Redirecting you home in a few seconds…</p>
    <p style="margin-top:16px;"><a href="/index.html" style="color:var(--vw-accent-2);">Go now</a></p>
  </main>
</body>
</html>
